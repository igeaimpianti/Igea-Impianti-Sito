<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060b13"><title>Dettaglio prodotto | IGEA IMPIANTI</title><style>*{box-sizing:border-box}body{margin:0;background:#060b13;color:#f5faff;font:16px system-ui,-apple-system,sans-serif}a{color:#91d1ff;text-decoration:none}header{background:#091523;border-bottom:1px solid #ffffff24;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;letter-spacing:.14em;color:white}.wrap{max-width:980px;margin:45px auto 90px;padding:0 20px}.product{background:linear-gradient(140deg,#101e30,#09121d);border:1px solid #ffffff26;border-radius:16px;overflow:hidden}.image{background:white;display:grid;place-items:center}.image img{width:100%;max-height:460px;object-fit:contain}.body{padding:clamp(20px,5vw,45px)}.sku{color:#8bcbff;font-size:12px;letter-spacing:.14em}h1{font-size:clamp(26px,5vw,42px);line-height:1.2}p{color:#b3c6d8;line-height:1.85;white-space:pre-line;overflow-wrap:anywhere}.quote{display:inline-block;margin-top:25px;background:#d8efff;color:#061321;padding:15px 22px;font-size:13px;font-weight:800;text-transform:uppercase}.back{display:inline-block;margin-bottom:22px}.error{padding:40px;color:#b9cde0}</style></head><body><header><a class="brand" href="./index.html">IGEA IMPIANTI</a><a href="./prodotti.html">← Prodotti</a></header><main class="wrap"><a class="back" href="./prodotti.html">← Torna al catalogo</a><article class="product" id="detail"><p class="error">Caricamento articolo…</p></article></main><script>const endpoint='https://wcvocgdsgzovaaxrvyau.supabase.co/functions/v1/public-catalog';const root=document.getElementById('detail');const id=new URLSearchParams(location.search).get('id');const E=(t,c,txt)=>{const x=document.createElement(t);if(c)x.className=c;if(txt!==undefined)x.textContent=txt;return x};if(!id){root.textContent='Articolo non specificato.'}else fetch(endpoint,{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw Error('Catalogo non disponibile');return r.json()}).then(d=>{const p=(d.products||[]).find(x=>String(x.id)===id);if(!p){root.textContent='Articolo non disponibile.';return}root.replaceChildren();if(p.image_url&&/^https:\/\//.test(p.image_url)){const holder=E('div','image'),img=E('img');img.src=p.image_url;img.alt=p.name;holder.append(img);root.append(holder)}const body=E('div','body');if(p.brand)body.append(E('div','sku',p.brand));body.append(E('h1','',p.name));body.append(E('p','',p.description||'Contattaci per maggiori informazioni.'));const a=E('a','quote','Richiedi preventivo');a.href='mailto:preventivi@igeaimpianti.com?subject='+encodeURIComponent('Preventivo prodotto: '+p.name)+'&body='+encodeURIComponent('Buongiorno, desidero un preventivo per '+p.name+'.');body.append(a);root.append(body);document.title=p.name+' | IGEA IMPIANTI'}).catch(()=>root.textContent='Impossibile caricare il prodotto. Riprova più tardi.');</script></body></html>
