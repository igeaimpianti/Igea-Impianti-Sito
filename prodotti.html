<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060b13"><title>Prodotti | IGEA IMPIANTI</title><meta name="description" content="Catalogo IGEA IMPIANTI: tutti i prodotti in ordine di inserimento, filtri per categoria e sottocategoria, preventivi personalizzati."><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#12334d55,transparent 50%),#060b13;color:#f5faff;font-family:system-ui,-apple-system,Arial,sans-serif}a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:5;background:#08111df0;border-bottom:1px solid #ffffff20;backdrop-filter:blur(16px)}.bar{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:21px 24px}.brand{font-weight:850;letter-spacing:.14em}.back{color:#92cfff;font-size:13px}.wrap{max-width:1200px;margin:auto;padding:60px 24px 100px}.eyebrow{color:#70bfff;letter-spacing:.25em;font-size:11px;font-weight:800}.heading{font-size:clamp(42px,7vw,82px);letter-spacing:-.07em;margin:17px 0}.intro{color:#a8bed2;line-height:1.7;max-width:650px}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:38px 0 20px}.tools input,.tools select{min-width:0;width:100%;padding:16px;background:#101f30;border:1px solid #40576c;color:white;font:inherit;border-radius:6px}.count{font-size:13px;color:#91b2ce;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}.product{border:1px solid #ffffff24;background:linear-gradient(145deg,#101d2d,#09111c);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:110px}.product:target{outline:2px solid #7bc8ff}.product img{width:100%;height:155px;object-fit:contain;background:white}.placeholder{height:155px;display:grid;place-items:center;background:#112235;color:#7bbfea;font-size:14px}.content{padding:16px;display:flex;flex:1;flex-direction:column}.brandname{font-size:11px;color:#7dc8ff;letter-spacing:.15em;text-transform:uppercase}.product h3{font-size:16px;line-height:1.3}.product p{color:#a8bbcb;line-height:1.55;flex:1;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.quote{display:inline-flex;justify-content:center;margin-top:10px;padding:13px 17px;background:#dff1ff;color:#061321;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.empty{padding:30px 0;color:#a7bfd3;line-height:1.8}.more{display:block;margin:30px auto;padding:14px 30px;border:1px solid #7bc8ff;background:#10253a;color:white;cursor:pointer;font:700 13px system-ui}.readmore{display:inline-block;margin:8px 0;color:#8ed0ff;font-size:13px;font-weight:750}.pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin:30px 0}.pagination button{padding:10px 14px;border:1px solid #6bbcf3;background:#11283e;color:white;border-radius:6px}.pagination button:disabled{opacity:.35}.pagination span{font-size:13px;color:#b5cde1}footer{border-top:1px solid #ffffff20;padding:24px;color:#7894aa;text-align:center;font-size:12px}@media(max-width:700px){.wrap{padding-top:38px}.tools{grid-template-columns:1fr}.bar{padding:18px}}@media(max-width:700px){.grid{grid-template-columns:1fr;gap:12px}.product{display:grid;grid-template-columns:116px minmax(0,1fr);align-items:start;border-radius:12px}.product img,.product .placeholder{width:116px;height:116px;object-fit:contain;grid-column:1;grid-row:1;background:#fff}.product .placeholder{background:#112235;font-size:10px;text-align:center}.product .content{grid-column:2;grid-row:1;padding:12px 13px;min-width:0}.product h3{font-size:15px;line-height:1.3;margin:7px 0}.product p{font-size:12px;line-height:1.45;-webkit-line-clamp:2;margin:5px 0}.product .brandname{font-size:10px;letter-spacing:.08em}.product .readmore{font-size:12px;margin:6px 0}.product .quote{font-size:10px;padding:10px 8px;margin-top:7px;letter-spacing:0}.product:target{scroll-margin-top:90px}}@media(min-width:701px){.product{display:grid;grid-template-columns:145px minmax(0,1fr)}.product img,.product .placeholder{height:145px;width:145px;grid-column:1;grid-row:1}.product .content{grid-column:2;grid-row:1;padding:14px}.product h3{font-size:16px;margin:6px 0}.product p{-webkit-line-clamp:2;font-size:12px}.product .quote{font-size:10px;padding:10px}} .product-title{color:inherit;text-decoration:none}.product-title:hover,.brandname:hover{text-decoration:underline}.product .brandname{display:inline-block}.product .content{justify-content:center}</style></head><body><header><div class="bar"><a href="./index.html" class="brand">IGEA IMPIANTI</a><a class="back" href="./index.html">← Home</a></div></header><main class="wrap"><div class="eyebrow">IGEA IMPIANTI / CATALOGO</div><h1 class="heading">Prodotti<span style="color:#69bdff">.</span></h1><p class="intro">Tutte le novità, dai prodotti aggiunti più recentemente ai precedenti. Filtra per categoria o sottocategoria e richiedi un preventivo personalizzato.</p><div class="tools"><input id="search" type="search" placeholder="Cerca un prodotto…" aria-label="Cerca prodotti"><select id="category" aria-label="Filtra categoria"><option value="">Tutte le categorie</option></select><select id="subcategory" aria-label="Filtra sottocategoria"><option value="">Tutte le sottocategorie</option></select></div><p id="count" class="count" aria-live="polite">Caricamento catalogo…</p><div id="catalog" class="grid"></div><nav id="pagination" class="pagination" aria-label="Pagine del catalogo"></nav></main><footer>© <span id="year"></span> IGEA IMPIANTI · Preventivi personalizzati · Nessun acquisto online</footer><script>document.getElementById('year').textContent=new Date().getFullYear();const endpoint='https://wcvocgdsgzovaaxrvyau.supabase.co/functions/v1/public-catalog';const box=document.getElementById('catalog'),cat=document.getElementById('category'),sub=document.getElementById('subcategory'),search=document.getElementById('search'),count=document.getElementById('count'),pagination=document.getElementById('pagination');let data={categories:[],subcategories:[],products:[]},page=1;const params=new URLSearchParams(location.search);const E=(t,c,v)=>{const e=document.createElement(t);if(c)e.className=c;if(v!==undefined)e.textContent=v;return e};function subOptions(){const previous=sub.value;sub.replaceChildren(new Option('Tutte le sottocategorie',''));data.subcategories.filter(s=>!cat.value||s.category_id===cat.value).forEach(s=>sub.add(new Option(s.name,s.id)));if([...sub.options].some(x=>x.value===previous))sub.value=previous}function draw(){const q=search.value.trim().toLocaleLowerCase('it');let items=data.products.filter(p=>(!sub.value||p.subcategory_id===sub.value)&&(!cat.value||data.subcategories.some(s=>s.id===p.subcategory_id&&s.category_id===cat.value))&&(!q||[p.name,p.brand,p.description].join(' ').toLocaleLowerCase('it').includes(q))).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));count.textContent=items.length+' articoli trovati · dal più recente al più vecchio';box.replaceChildren();const totalPages=Math.max(1,Math.ceil(items.length/10));page=Math.min(page,totalPages);const shown=items.slice((page-1)*10,page*10);pagination.replaceChildren();if(totalPages>1){const prev=E('button','','← Precedente');prev.disabled=page===1;prev.onclick=()=>{page--;draw();document.getElementById('catalog').scrollIntoView({block:'start'})};const label=E('span','',page+' / '+totalPages);const next=E('button','','Successiva →');next.disabled=page===totalPages;next.onclick=()=>{page++;draw();document.getElementById('catalog').scrollIntoView({block:'start'})};pagination.append(prev,label,next)}shown.forEach(p=>{const card=E('article','product');card.id='product-'+p.id;const href='./articolo.html?id='+encodeURIComponent(p.id);if(p.image_url&&/^https:\/\//.test(p.image_url)){const img=E('img');img.src=p.image_url;img.alt=p.name;img.loading='lazy';card.append(img)}else card.append(E('div','placeholder','IGEA IMPIANTI · PRODOTTO'));const content=E('div','content');if(p.brand){const code=E('a','brandname',p.brand);code.href=href;content.append(code)}const title=E('h3');const titleLink=E('a','product-title',p.name);titleLink.href=href;title.append(titleLink);content.append(title);if(p.description)content.append(E('p','',p.description));const read=E('a','readmore','Continua a leggere →');read.href=href;content.append(read);card.append(content);box.append(card)});if(!items.length)box.append(E('p','empty','Nessun articolo corrisponde ai filtri selezionati.'))}cat.addEventListener('change',()=>{subOptions();page=1;draw()});sub.addEventListener('change',()=>{showAll=false;draw()});search.addEventListener('input',()=>{showAll=false;draw()});fetch(endpoint,{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw Error('catalog');return r.json()}).then(d=>{data=d;data.categories.forEach(c=>cat.add(new Option(c.name,c.id)));subOptions();if(params.has('subcategory')){const s=data.subcategories.find(x=>x.id===params.get('subcategory'));if(s){cat.value=s.category_id;subOptions();sub.value=s.id}}if(params.has('category')){cat.value=params.get('category');subOptions()}if(params.has('product')){location.replace('./articolo.html?id='+encodeURIComponent(params.get('product')));return}draw()}).catch(()=>{count.textContent='Catalogo temporaneamente non disponibile';box.append(E('p','empty','Per informazioni scrivi a preventivi@igeaimpianti.com.'))});</script></body></html>
