<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060b13"><title>Prodotti | IGEA IMPIANTI</title><meta name="description" content="Catalogo IGEA IMPIANTI: tutti i prodotti in ordine di inserimento, filtri per categoria e sottocategoria, preventivi personalizzati."><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#12334d55,transparent 50%),#060b13;color:#f5faff;font-family:system-ui,-apple-system,Arial,sans-serif}a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:5;background:#08111df0;border-bottom:1px solid #ffffff20;backdrop-filter:blur(16px)}.bar{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:21px 24px}.brand{font-weight:850;letter-spacing:.14em}.back{color:#92cfff;font-size:13px}.wrap{max-width:1200px;margin:auto;padding:60px 24px 100px}.eyebrow{color:#70bfff;letter-spacing:.25em;font-size:11px;font-weight:800}.heading{font-size:clamp(42px,7vw,82px);letter-spacing:-.07em;margin:17px 0}.intro{color:#a8bed2;line-height:1.7;max-width:650px}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:38px 0 20px}.tools input,.tools select{min-width:0;width:100%;padding:16px;background:#101f30;border:1px solid #40576c;color:white;font:inherit;border-radius:6px}.count{font-size:13px;color:#91b2ce;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.product{border:1px solid #ffffff24;background:linear-gradient(145deg,#101d2d,#09111c);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:110px}.product:target{outline:2px solid #7bc8ff}.product img{width:100%;height:215px;object-fit:contain;background:white}.placeholder{height:215px;display:grid;place-items:center;background:#112235;color:#7bbfea;font-size:14px}.content{padding:23px;display:flex;flex:1;flex-direction:column}.brandname{font-size:11px;color:#7dc8ff;letter-spacing:.15em;text-transform:uppercase}.product h3{font-size:19px;line-height:1.3}.product p{color:#a8bbcb;line-height:1.55;flex:1}.quote{display:inline-flex;justify-content:center;margin-top:10px;padding:13px 17px;background:#dff1ff;color:#061321;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.empty{padding:30px 0;color:#a7bfd3;line-height:1.8}.more{display:block;margin:30px auto;padding:14px 30px;border:1px solid #7bc8ff;background:#10253a;color:white;cursor:pointer;font:700 13px system-ui}footer{border-top:1px solid #ffffff20;padding:24px;color:#7894aa;text-align:center;font-size:12px}@media(max-width:700px){.wrap{padding-top:38px}.tools{grid-template-columns:1fr}.bar{padding:18px}}</style></head><body><header><div class="bar"><a href="./index.html" class="brand">IGEA IMPIANTI</a><a class="back" href="./index.html">← Home</a></div></header><main class="wrap"><div class="eyebrow">IGEA IMPIANTI / CATALOGO</div><h1 class="heading">Prodotti<span style="color:#69bdff">.</span></h1><p class="intro">Tutte le novità, dai prodotti aggiunti più recentemente ai precedenti. Filtra per categoria o sottocategoria e richiedi un preventivo personalizzato.</p><div class="tools"><input id="search" type="search" placeholder="Cerca un prodotto…" aria-label="Cerca prodotti"><select id="category" aria-label="Filtra categoria"><option value="">Tutte le categorie</option></select><select id="subcategory" aria-label="Filtra sottocategoria"><option value="">Tutte le sottocategorie</option></select></div><p id="count" class="count" aria-live="polite">Caricamento catalogo…</p><div id="catalog" class="grid"></div><button id="more" class="more" type="button" hidden>Mostra tutti gli articoli</button></main><footer>© <span id="year"></span> IGEA IMPIANTI · Preventivi personalizzati · Nessun acquisto online</footer><script>document.getElementById('year').textContent=new Date().getFullYear();const endpoint='https://wcvocgdsgzovaaxrvyau.supabase.co/functions/v1/public-catalog';const box=document.getElementById('catalog'),cat=document.getElementById('category'),sub=document.getElementById('subcategory'),search=document.getElementById('search'),count=document.getElementById('count'),more=document.getElementById('more');let data={categories:[],subcategories:[],products:[]},showAll=false;const params=new URLSearchParams(location.search);const E=(t,c,v)=>{const e=document.createElement(t);if(c)e.className=c;if(v!==undefined)e.textContent=v;return e};function subOptions(){const previous=sub.value;sub.replaceChildren(new Option('Tutte le sottocategorie',''));data.subcategories.filter(s=>!cat.value||s.category_id===cat.value).forEach(s=>sub.add(new Option(s.name,s.id)));if([...sub.options].some(x=>x.value===previous))sub.value=previous}function draw(){const q=search.value.trim().toLocaleLowerCase('it');let items=data.products.filter(p=>(!sub.value||p.subcategory_id===sub.value)&&(!cat.value||data.subcategories.some(s=>s.id===p.subcategory_id&&s.category_id===cat.value))&&(!q||[p.name,p.brand,p.description].join(' ').toLocaleLowerCase('it').includes(q))).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));count.textContent=items.length+' articoli trovati · dal più recente al più vecchio';box.replaceChildren();const shown=showAll?items:items.slice(0,10);more.hidden=items.length<=10||showAll;shown.forEach(p=>{const card=E('article','product');card.id='product-'+p.id;if(p.image_url&&/^https:\/\//.test(p.image_url)){const img=E('img');img.src=p.image_url;img.alt=p.name;img.loading='lazy';card.append(img)}else card.append(E('div','placeholder','IGEA IMPIANTI · PRODOTTO'));const content=E('div','content');if(p.brand)content.append(E('div','brandname',p.brand));content.append(E('h3','',p.name));if(p.description)content.append(E('p','',p.description));const link=E('a','quote','Richiedi preventivo ↗');link.href='mailto:preventivi@igeaimpianti.com?subject='+encodeURIComponent('Preventivo prodotto: '+p.name)+'&body='+encodeURIComponent('Buongiorno, desidero un preventivo personalizzato per '+p.name+'.');content.append(link);card.append(content);box.append(card)});if(!items.length)box.append(E('p','empty','Nessun articolo corrisponde ai filtri selezionati.'))}cat.addEventListener('change',()=>{subOptions();showAll=false;draw()});sub.addEventListener('change',()=>{showAll=false;draw()});search.addEventListener('input',()=>{showAll=false;draw()});more.addEventListener('click',()=>{showAll=true;draw()});fetch(endpoint,{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw Error('catalog');return r.json()}).then(d=>{data=d;data.categories.forEach(c=>cat.add(new Option(c.name,c.id)));subOptions();if(params.has('subcategory')){const s=data.subcategories.find(x=>x.id===params.get('subcategory'));if(s){cat.value=s.category_id;subOptions();sub.value=s.id}}if(params.has('category')){cat.value=params.get('category');subOptions()}if(params.has('product'))showAll=true;draw();if(params.has('product'))requestAnimationFrame(()=>document.getElementById('product-'+params.get('product'))?.scrollIntoView({block:'center'}))}).catch(()=>{count.textContent='Catalogo temporaneamente non disponibile';box.append(E('p','empty','Per informazioni scrivi a preventivi@igeaimpianti.com.'))});</script></body></html>
